<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green in Blue Digital</title>
<meta name="description" content="Green in Blue Digital — site coming soon.">
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #14181A;
    color: #F4F2ED;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'IBM Plex Sans', Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    min-height: 100vh;
  }
  .wrap {
    max-width: 480px;
  }
  .mark {
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 0.5px;
    color: #8FA396;
    margin-bottom: 22px;
  }
  .mark .blue {
    color: #7FA8C9;
  }
  h1 {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 500;
    letter-spacing: -0.02em;
    margin: 0 0 14px;
    color: #F4F2ED;
  }
  h1 span {
    color: #7FA8C9;
  }
  p {
    font-size: 16px;
    line-height: 1.6;
    color: #B7BDB9;
    margin: 0 0 30px;
  }
  .line {
    width: 40px;
    height: 2px;
    background: #4A6350;
    margin: 0 auto 30px;
  }
  footer {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    font-size: 12px;
    color: #5A605C;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">Green in <span class="blue">Blue</span> Digital</div>
    <h1>Something's <span>coming</span> together.</h1>
    <div class="line"></div>
    <p>We're a small digital shop building things worth building. This site is on its way.</p>
  </div>
  <footer>&copy; 2026 Green in Blue Digital LLC</footer>
</body>
</html>
